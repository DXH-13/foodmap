name: Cập nhật con trỏ submodule

# Kéo con trỏ của 4 submodule lên commit mới nhất trên nhánh main của từng repo con,
# rồi mở PR ở repo cha. Chạy tay khi cần, hoặc tự động mỗi sáng thứ Hai.
#
# Vì sao cần: commit trong repo con KHÔNG tự cập nhật con trỏ ở repo cha. Quên bước này
# thì người khác clone về sẽ thấy code cũ — cái bẫy phổ biến nhất của git submodule
# (xem ADR-0004).

on:
  workflow_dispatch:
  schedule:
    # 08:00 giờ Việt Nam thứ Hai hằng tuần (01:00 UTC)
    - cron: '0 1 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Kéo submodule lên bản mới nhất
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Cập nhật từng submodule về đầu nhánh main
        id: update
        run: |
          git submodule update --remote --recursive

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Khong co submodule nao thay doi."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Tóm tắt commit mới của từng submodule để đưa vào mô tả PR
          {
            echo 'summary<<EOF'
            git submodule foreach --quiet '
              echo "### $name"
              git log --oneline -5
              echo
            '
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Mở pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
          branch: chore/bump-submodules
          delete-branch: true
          commit-message: 'chore(submodule): cap nhat con tro len ban moi nhat'
          title: 'chore(submodule): cập nhật con trỏ lên bản mới nhất'
          body: |
            Cập nhật tự động con trỏ submodule lên commit mới nhất trên nhánh `main`
            của từng repo con.

            ${{ steps.update.outputs.summary }}

            Trước khi merge, kiểm tra CI của từng repo con đã xanh chưa.
